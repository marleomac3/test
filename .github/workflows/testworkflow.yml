name: test-workflow

on:
  workflow_dispatch:

jobs:
  test-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Test Step 1
        run: echo "test step 1"
    
  test-job-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: List GitHub Issues
        run: gh issue list --label "github pages"
