name: test-workflow

on:
  workflow_dispatch:

jobs:
  test-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Test Step 1
        run: echo "test step 1"
    
  test-job-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Authorize GH (GITHUB_TOKEN)
        env: 
          GH_TOKEN: ${{ github.token }}
        run: echo "{{ github.token }}"

      - name: List Open Issues
        run: gh issue list --state open --limit 50
